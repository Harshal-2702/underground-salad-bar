name: Release candidate validation

on:
  push:
    branches:
      - release/production-purchase-register
  pull_request:
    branches:
      - feature/phase-1-security

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-api
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ukos_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ukos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usb-api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usb-admin/package-lock.json
      - run: npm ci
      - run: npm run build
