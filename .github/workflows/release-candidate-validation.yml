name: Release candidate validation

on:
  push:
    branches:
      - release/production-purchase-register
      - staging-api-inventory-purchase
      - staging
  pull_request:
    branches:
      - feature/phase-1-security
      - staging

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ukos_migration_test_20261105
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ukos_migration_test_20261105"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: usb-api
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/ukos_migration_test_20261105
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:55432/ukos_migration_test_20261105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usb-api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed:catalogue:local
      - run: npm run build
      - run: npm test
      - run: npm run test:integration:local

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usb-admin/package-lock.json
      - run: npm ci
      - run: npm run build

  customer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
